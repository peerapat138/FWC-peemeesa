<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explode this balloon</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="balloon" onclick="upsize()" onmouseleave="downsize()"></div>

    <script>
        const balloon = document.getElementById("balloon");

        const colors = ["red", "green", "blue"];
        let colorIndex = 0;

        
        function upsize() {
            let size = parseInt(getComputedStyle(balloon).width);

            if (size >= 420) {
                
                balloon.style.width = "200px";
                balloon.style.height = "200px";
                balloon.style.backgroundColor = "red";
                colorIndex = 0;
            } else {
                size += 10;
                balloon.style.width = size + "px";
                balloon.style.height = size + "px";

                balloon.style.backgroundColor = colors[colorIndex];
                colorIndex = (colorIndex + 1) % colors.length;
            }
        }

        
        function downsize() {
            let size = parseInt(getComputedStyle(balloon).width);

            if (size > 200) {
                size -= 5;
                balloon.style.width = size + "px";
                balloon.style.height = size + "px";

              
                colorIndex = (colorIndex - 1 + colors.length) % colors.length;
                balloon.style.backgroundColor = colors[colorIndex];
            }
        }
    </script>

</body>
</html>
