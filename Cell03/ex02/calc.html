<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #a855f7, #6366f1);
}

#calForm {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 25px 30px;
    background-color: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

#calForm h1 {
    text-align: center;
    color: #4c1d95;
}

#val1,
#val2,
#op {
    height: 40px;
    border-radius: 10px;
    padding: 0 15px;
    border: 1px solid #c4b5fd;
    font-size: 14px;
}

#val1:focus,
#val2:focus,
#op:focus {
    outline: none;
    border-color: #7c3aed;
}

#op {
    cursor: pointer;
    background-color: white;
}

#calBtn {
    height: 45px;
    border-radius: 12px;
    border: none;
    background-color: #7c3aed;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

#calBtn:hover {
    background-color: #5b21b6;
    transform: translateY(-2px);
}

#calBtn:active {
    transform: translateY(0);
}

</style>
<body>
    <section class="container">
        <form id="calForm">
            <h1> Calculator </h1>
            <input id='val1' type="text" value="" placeholder="enter a number" required>
            <select id="op">
                <option value="+"> + </option>
                <option value="-"> - </option>
                <option value="*"> * </option>
                <option value="/"> / </option>
                <option value="%"> % </option>
            </select>
            <input id='val2' type="text" value="" placeholder="enter a number" required>
            <button id='calBtn' type="submit">Try me!</button>
        </form>
    </section>
</body>
<script>
    const val1 = document.getElementById("val1");
    const val2 = document.getElementById("val2");
    const op = document.getElementById("op");
    const calForm = document.getElementById("calForm");

    setInterval(() => {
      alert("Please, use me...");
    }, 30000);

    calForm.addEventListener("submit", (event) => {
        event.preventDefault();

        let value1 = val1.value;
        let value2 = val2.value;
        let opar = op.value;

        if (isNaN(value1) || isNaN(value2)) {
            alert("Error :(");
            console.log("Error :(");
            val1.value = "";
            val2.value = "";
            op.value = "+";
            return;
        }

        value1 = parseFloat(value1);
        value2 = parseFloat(value2);

        if (value1 < 0 || value2 < 0) {
            alert("Error :()");
            console.log("Error :(");
            val1.value = "";
            val2.value = "";
            op.value = "+";
            return;
        }

        if ((opar == "/" || opar == "%") && (value1 == 0 || value2 == 0)) {
            alert("It's over 9000!");
            console.log("It's over 9000!");
            val1.value = "";
            val2.value = "";
            op.value = "+";
            return;
        }

        console.log(eval(`${value1} ${opar} ${value2}`));
        alert("Result : " + eval(`${value1} ${opar} ${value2}`));

        val1.value = "";
        val2.value = "";
        op.value = "+";
    });
</script>
</html>
