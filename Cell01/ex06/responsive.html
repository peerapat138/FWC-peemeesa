<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
</head>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    table {
        width: 100%;
        height: 100vh;
        border-collapse: collapse;
        border: 1px solid black;
    }

    th {
        text-align: start;
        padding-left: 10px;
        border: 1px solid black;
    }

    .first {
        background-color: rgb(206, 73, 73);
    }

    .second {
        background-color: rgb(36, 140, 36);
    }

    @media (max-width: 640px) {
        .first {
            background-color: blanchedalmond;
        }
        .second {
            background-color: rgb(101, 231, 231);
        }
    }
</style>

<body>
    <table>
        <tr>
            <th class="first">1 cell</th>
            <th class="second">2 cell</th>
            <th class="first">3 cell</th>
            <th class="second">4 cell</th>
            <th class="first">5 cell</th>
        </tr>
    </table>
</body>
</html>
