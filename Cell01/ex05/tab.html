<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 05 - Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 40px;
            font-size: 18px;
        }
        .first {
            background-color: rgb(109, 149, 109); /* greenish */
        }
        .second {
            background-color: rgb(220, 140, 140); /* peach */
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
