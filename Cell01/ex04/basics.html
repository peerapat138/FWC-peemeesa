<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Basics</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: pink;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 48px;
            margin: 30px 0;
        }

        .shop-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 40px;
        }

        .shop img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .shop a {
            display: block;
            margin-top: 10px;
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-weight: bold;
        }

        hr {
            width: 100%;
            border: none;
            border-top: 2px solid white;
        }

        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
            margin: 10px 20px;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Online Shopping</h1>

    <div class="shop-container">
        <div class="shop">
            <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Shopee_logo.svg/1920px-Shopee_logo.svg.png?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="Shopee">
            <a href="https://shopee.co.th" target="_blank">https://shopee.co.th</a>
        </div>

        <div class="shop">
            <img src="https://laz-img-cdn.alicdn.com/tfs/TB1PApewFT7gK0jSZFpXXaTkpXa-200-200.png" alt="Lazada">
            <a href="https://www.lazada.co.th" target="_blank">https://www.lazada.co.th</a>
        </div>
    </div>

    <hr>

    <footer>
        © wil 2026
    </footer>

</body>

</html>
